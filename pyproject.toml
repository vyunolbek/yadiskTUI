[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "yadisk-cli"
version = "0.1.0"
description = "Yandex.Disk CLI browser with two-panel TUI"
requires-python = ">=3.10"
dependencies = [
    "yadisk[async-defaults]>=3.4",
    "yadisk[sync-defaults]>=3.4",
    "textual>=1.0",
    "typer>=0.12",
    "aiofiles>=23",
    "tomli-w>=1.0",
]

[project.scripts]
yd = "yadisk_cli.cli:app"

[tool.setuptools]
packages = ["yadisk_cli", "yadisk_cli.widgets"]
